<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pestañas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="pestanas">
    <div id="botones-pestanas">
      <button class="boton-pestana activa" data-indice="0">Pestaña 1</button>
      <button class="boton-pestana" data-indice="1">Pestaña 2</button>
      <button class="boton-pestana" data-indice="2">Pestaña 3</button>
    </div>

    <div id="contenido-pestanas">
      <div class="contenido">
        <h2>Contenido 1</h2>
        <p>Este es el contenido de la primera pestaña.</p>
      </div>
      <div class="contenido oculto">
        <h2>Contenido 2</h2>
        <p>Este es el contenido de la segunda pestaña.</p>
      </div>
      <div class="contenido oculto">
        <h2>Contenido 3</h2>
        <p>Este es el contenido de la tercera pestaña.</p>
      </div>
    </div>
  </div>
  <script type="module" src="6.js"></script>
</body>
</html>
