<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtrar ciudades por país</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Ciudades del mundo</h1>

    <div class="controles">
      <input type="text" id="filtro" placeholder="Escribe un país (ej: España)">
      <button id="filtrar" type="button">Filtrar</button>
      <button id="limpiar" type="button" class="secundario">Mostrar todo</button>
    </div>

    <ul id="lista-ciudades"></ul>
  </main>
  <script type="module" src="9.js"></script>
</body>
</html>
